<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CuraFrame{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
    a { color: #4a6fa5; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    nav { background: #1a1a2e; color: #fff; padding: 0.75rem 2rem; display: flex; align-items: center; gap: 2rem; }
    nav .brand { font-size: 1.2rem; font-weight: 700; color: #fff; }
    nav a { color: #cce0ff; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    nav .spacer { flex: 1; }

    /* Main container */
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    /* Cards */
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 2rem; margin-bottom: 1.5rem; }
    .card h2 { margin-bottom: 1rem; font-size: 1.3rem; }

    /* Buttons */
    .btn { display: inline-block; padding: 0.55rem 1.4rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: background 0.15s; }
    .btn-primary { background: #4a6fa5; color: #fff; }
    .btn-primary:hover { background: #3b5a8a; }
    .btn-secondary { background: #e2e8f0; color: #1a1a2e; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-sm { padding: 0.35rem 0.9rem; font-size: 0.85rem; }

    /* Forms */
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
    input[type=text], input[type=email], input[type=password], input[type=number], select {
      width: 100%; padding: 0.55rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: #4a6fa5; box-shadow: 0 0 0 3px rgba(74,111,165,.2); }

    /* Alerts */
    .alert { padding: 0.9rem 1.2rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.95rem; }
    .alert-error { background: #fde8e8; border: 1px solid #f5c6c6; color: #922; }
    .alert-success { background: #e8fde8; border: 1px solid #c6f5c6; color: #292; }
    .alert-warning { background: #fff8e1; border: 1px solid #ffe082; color: #856404; }
    .alert-info { background: #e8f0fd; border: 1px solid #b3c8f5; color: #2255aa; }

    /* Status badges */
    .badge { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .badge-accepted { background: #d1fae5; color: #065f46; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-indeterminate { background: #fef9c3; color: #854d0e; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 700; }

    /* Dashboard grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    .feature-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 1.5rem; text-align: center; }
    .feature-card .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .feature-card h3 { margin-bottom: 0.5rem; }
    .feature-card p { font-size: 0.88rem; color: #64748b; margin-bottom: 1rem; }

    /* Auth pages */
    .auth-wrapper { max-width: 420px; margin: 4rem auto; }
    .auth-wrapper .card { padding: 2.5rem; }
    .auth-wrapper h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }

    footer { text-align: center; color: #94a3b8; font-size: 0.8rem; padding: 2rem; }
  </style>
</head>
<body>
{% if user is defined and user %}
<nav>
  <span class="brand">🧬 CuraFrame</span>
  <a href="/dashboard">Dashboard</a>
  <a href="/calculator">Calculator</a>
  <span class="spacer"></span>
  <span style="color:#94a3b8;font-size:.9rem">{{ user }}</span>
  <a href="/logout">Logout</a>
</nav>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<footer>CuraFrame — Constraint-driven reasoning for therapeutic design</footer>
</body>
</html>
