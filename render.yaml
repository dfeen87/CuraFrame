services:
  - type: web
    name: curaframe-web
    env: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn apps.web.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: CURAFRAME_DB
        value: /opt/render/project/src/curaframe.db
