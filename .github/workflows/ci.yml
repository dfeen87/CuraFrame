name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CuraFrame and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import sanity check
        run: python -c "import cura_frame"

      # Recording is off unless CURAFRAME_LEDGER_ROOT is set, so the suite runs
      # with it on to prove the recorder works end to end rather than only in
      # its own unit tests. The ledger it writes is gitignored and rebuilt each
      # run; verifying it below is what makes "the recorder ran" checkable.
      - name: Run test suite
        env:
          CURAFRAME_LEDGER_ROOT: ${{ github.workspace }}
        run: pytest

      - name: Verify the verdict ledger
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from cura_frame import governance

          root = Path.cwd()
          findings = governance.validate(root)

          # `read()` is strict and raises on a file that is not a ledger, so the
          # row count is taken defensively: losing the finding to a traceback
          # would leave the log saying nothing useful about a tampered ledger,
          # which is the failure this step exists to prevent.
          try:
              rows = len(governance.read(root))
          except governance.LedgerError:
              rows = "unreadable"

          print(f"verdict ledger: {rows} rows, chain {'ok' if not findings else 'BROKEN'}")
          for finding in findings:
              print(f"  {finding}")

          if rows == 0:
              print("  no verdicts were recorded; the recorder did not run")
              sys.exit(1)
          sys.exit(1 if findings else 0)
          PY

      - name: CLI smoke test
        run: python -m cura_frame.cli --help

      - name: Bytecode compile check
        run: python -m compileall cura_frame
